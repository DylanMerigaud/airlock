[project]
name = "airlock"
version = "0.1.0"
description = "Ship or block a generated media asset on proof: four gates, a Grafana-backed verdict, and a calibration ledger."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "google-adk[mcp]>=2.8",
    "google-cloud-aiplatform[adk,agent_engines]>=1.100",
    "mcp>=1.24,<2",
    "httpx>=0.27",
    "pyyaml>=6",
    "c2pa-python>=0.37.8",
    "google-cloud-videointelligence>=2.20.0",
    "google-genai>=2.20.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# The demo video pipeline (video/): the draft narration is synthesised, the final voice is Dylan's.
video = [
    "google-cloud-texttospeech>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock", "airlock_mcp"]
